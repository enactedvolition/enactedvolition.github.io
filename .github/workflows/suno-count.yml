name: Update Suno track count

on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: suno-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public count (keeps last value on failure)
        run: python3 scripts/update_suno_count.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/suno.json && ! git ls-files --others --exclude-standard data/suno.json | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/suno.json
          git commit -m "Update Suno track count"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger deploy.yml, but workflow_dispatch is allowed.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
